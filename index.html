<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Technology Tree</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="menu-shell">
        <button id="menu-toggle-btn" aria-expanded="false" aria-controls="menu-panel" title="開啟選單">☰</button>
        <div id="menu-panel">
            <div id="ui-layer">
                <button id="theme-btn">Theme</button>
                <button id="add-node-btn">+ Node</button>
                <button id="toggle-view-btn">2D View</button>
                <button id="physics-btn">Physics: ON</button>
                <button id="preview-btn">Preview: OFF</button>
                <button id="export-btn">Export</button>
                <button id="import-btn">Import</button>
                <input id="import-card-input" type="file" accept="application/json" hidden>
            </div>

            <div id="share-options">
                <span>Share Options</span>
                <label><input type="checkbox" data-share-field="name" checked>NAME</label>
                <label><input type="checkbox" data-share-field="org" checked>ORG</label>
                <label><input type="checkbox" data-share-field="edu" checked>EDU</label>
                <label><input type="checkbox" data-share-field="intro" checked>INTRO</label>
                <label><input type="checkbox" data-share-field="imgUrl" checked>IMG URL</label>
                <label><input type="checkbox" data-share-field="introUrl" checked>INTRO URL</label>
                <label><input type="checkbox" data-share-field="descriptions" checked>DESCRIPTIONS</label>
            </div>

            <div id="search-panel">
                <div id="search-input-container">
                    <input type="text" id="search-input" placeholder="Search Tag..." />
                    <div id="search-tag-cloud" class="tag-cloud" style="display: none;"></div>
                </div>
                <button id="search-mode-btn" title="Text/List Mode" style="padding: 8px 12px;">≡</button>
                <button id="reset-search-btn" style="padding: 8px 12px;">Clear</button>
            </div>
        </div>
    </div>

    <div id="quick-actions" aria-label="Quick Actions">
        <button id="card-book-btn">Cards</button>
        <button id="share-btn">Share</button>
    </div>

    <div id="info-panel">
        <div id="skill-view" style="display: none;">
            <h3 id="skill-title">Node Info</h3>
            
            <label>Dependencies:</label>
            <select id="node-parent" multiple></select>
            
            <label>Skill Title:</label>
            <input type="text" id="node-title" />

            <div class="form-row">
                <label>Node Category:
                    <select id="node-category">
                        <option value="skill">Skills</option>
                        <option value="experience">Experience</option>
                        <option value="credential">Credential</option>
                        <option value="explore">Exploring</option>
                    </select>
                </label>
                <label>Importance Level:
                    <select id="node-level">
                        <option value="1">Hello World</option>
                        <option value="2" selected>Production</option>
                        <option value="3">Critical Dependency</option>
                    </select>
                </label>
            </div>
            
            <label style="display: block; width: 100%;">
                Tags:
                <button id="edit-mode-btn" class="toggle-mode-btn">≡ List</button>
            </label>
            <input type="text" id="node-tags" />
            <div id="edit-tag-cloud" class="tag-cloud" style="display: none; margin-bottom: 16px;"></div>
            
            <label>Details:</label>
            <textarea id="node-desc" rows="4"></textarea>
        </div>

        <div id="profile-view" style="display: none;">
            <h3 id="profile-title">My Profile</h3>
            <div style="display: flex; gap: 20px; margin-bottom: 10px;">
                <div style="flex: 0 0 100px; display: flex; flex-direction: column; align-items: center;">
                    <img id="profile-img-preview" src="https://via.placeholder.com/150" alt="Avatar">
                    <input type="text" id="profile-img-url" placeholder="IMG URL" style="font-size: 11px; padding: 6px; text-align: center; margin-top: 0; border-radius: 0;">
                </div>
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-start;">
                    <input type="text" id="profile-name" placeholder="NAME" style="margin-top: 0;">
                    <input type="text" id="profile-org" placeholder="ORG">
                    <input type="text" id="profile-edu" placeholder="EDU" style="margin-bottom: 0;">
                </div>
            </div>
            <label style="font-size: 13px;">Profile Intro:</label>
            <textarea id="profile-intro" rows="5"></textarea>
            <input type="url" id="profile-intro-urls" placeholder="https://your-homepage.dev"/>
        </div>

        <button id="save-btn" style="width:100%; margin-top: 10px; padding: 12px; font-size: 14px;">Save Changes</button>
        <button id="delete-btn" style="width:100%; margin-top: 10px; padding: 12px; font-size: 14px; background: transparent;">Delete Node</button>
        <button id="save-card-btn" style="width:100%; margin-top: 10px; padding: 12px; font-size: 14px; display: none;">Save This Card</button>
    </div>

    <div id="identity-card" aria-live="polite">
        <div id="identity-name">YOUR NAME</div>
        <div id="identity-org">Personal Technology Tree</div>
    </div>

    <div id="card-book-overlay" class="modal-overlay">
        <section id="card-book" aria-label="CARDS BOOK">
            <div class="modal-header">
                <div>
                    <div class="eyebrow">LOCAL CARD BOOK</div>
                    <h2>Cards book</h2>
                </div>
                <button id="close-card-book-btn" aria-label="Close Cards Book">×</button>
            </div>
            <p class="card-book-note">Cards will be saved in this browser. You can still open the snapshot saved at the time of bookmarking, even if the original link is no longer valid.</p>
            <!-- <div style="display: flex; flex-direction: row;">
                <input id="card-book-search" type="search" placeholder="Search Name, Org or Tags">
                <div id="card-book-filters" class="tag-cloud" aria-label="名片分類標籤"></div>
            </div> -->
            <input id="card-book-search" type="search" placeholder="Search Name, Org or Tags">
            <div id="card-book-filters" class="tag-cloud" aria-label="Tags"></div>
            
            <div id="card-book-list"></div>
        </section>
    </div>

    <div id="import-modal-overlay" class="modal-overlay">
        <section id="import-modal" aria-label="匯入名片確認">
            <div class="eyebrow">IMPORT CARD</div>
            <h2>Import</h2>
            <p id="import-preview-text"></p>
            <div class="modal-actions">
                <button id="cancel-import-btn">Cancle</button>
                <button id="confirm-import-btn">Import</button>
            </div>
        </section>
    </div>

    <div id="qr-modal-overlay">
        <div id="qr-modal">
            <div id="qr-title">Share Link</div>
            <div id="qr-container"></div>
            
            <div style="display: flex; gap: 8px; width: 100%; margin-bottom: 20px;">
                <input type="text" id="share-link-input" readonly style="margin: 0; font-size: 13px; border-radius: 0; padding: 10px; background: var(--bg-color);">
                <button id="copy-link-btn" style="border-radius: 0; background: var(--heading-color); color: var(--bg-color); border: none; padding: 0 16px;">Copy</button>
            </div>
            
            <button id="close-qr-btn">Close</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="animation.js"></script>
    <script src="script.js"></script>

</body>
</html>
